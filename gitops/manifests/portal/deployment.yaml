apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels: {app: portal}
spec:
  replicas: 1
  selector:
    matchLabels: {app: portal}
  template:
    metadata:
      labels: {app: portal}
    spec:
      serviceAccountName: portal
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: portal
          image: ghcr.io/ayush-singh986/idp-portal:latest
          ports: [{name: http, containerPort: 8501}]
          env:
            - {name: DOCS_URL, value: "http://docs-assistant.docs-assistant.svc.cluster.local:8000"}
            - {name: MODEL_URL, value: "http://model-serving.model-serving.svc.cluster.local:8000"}
            - {name: GATEWAY_URL, value: "http://llm-gateway.llm-gateway.svc.cluster.local:8000"}
            - {name: AIOPS_URL, value: "http://aiops-agent.aiops-agent.svc.cluster.local:8000"}
            - {name: GRAFANA_URL, value: "http://grafana.idp.local"}
            - name: IDP_ENVIRONMENTS
              value: >-
                {"dev":{"services":{"docs":"http://docs-assistant.docs-assistant.svc.cluster.local:8000","model":"http://model-serving.model-serving.svc.cluster.local:8000","gateway":"http://llm-gateway.llm-gateway.svc.cluster.local:8000","aiops":"http://aiops-agent.aiops-agent.svc.cluster.local:8000"},"grafana":"http://grafana.idp.local","namespaces":{"docs-assistant":"docs-assistant","model-serving":"model-serving","llm-gateway":"llm-gateway","aiops-agent":"aiops-agent","portal":"portal","prometheus":"monitoring","grafana":"monitoring"},"workload_labels":{"prometheus":"app.kubernetes.io/name=prometheus","grafana":"app.kubernetes.io/name=grafana"}}}
            - name: OPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-ops-access
                  key: token
                  optional: true
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
