apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: portal
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-pod-log-reader
  namespace: docs-assistant
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-pod-log-reader
  namespace: docs-assistant
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-pod-log-reader
---
