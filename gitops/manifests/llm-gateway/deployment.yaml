apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels: {app: llm-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-gateway}
  template:
    metadata:
      labels: {app: llm-gateway}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: llm-gateway
          image: ghcr.io/ayush-singh986/idp-llm-gateway:latest
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: LLM_PROVIDER, value: "mock"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: llm-gateway-secrets, key: ANTHROPIC_API_KEY, optional: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
