apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  labels: {app: aiops-agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app: aiops-agent}
  template:
    metadata:
      labels: {app: aiops-agent}
    spec:
      serviceAccountName: aiops-agent
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: aiops-agent
          image: ghcr.io/ayush-singh986/idp-aiops-agent:latest
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: PROMETHEUS_URL, value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"}
            - {name: GATEWAY_URL, value: "http://llm-gateway.llm-gateway.svc.cluster.local:8000"}
            - {name: ENABLE_REMEDIATION, value: "false"}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
