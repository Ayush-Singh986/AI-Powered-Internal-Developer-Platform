apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  labels: {app: model-serving}
spec:
  replicas: 1
  selector:
    matchLabels: {app: model-serving}
  template:
    metadata:
      labels: {app: model-serving}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: model-serving
          image: ghcr.io/YOUR_GITHUB_USER/idp-model-serving:latest
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: MODEL_VERSION, value: "v1-synthetic"}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
