apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ayush-Singh986/AI-Powered-Internal-Developer-Platform.git
    targetRevision: main
    path: gitops/manifests/aiops-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-agent
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
