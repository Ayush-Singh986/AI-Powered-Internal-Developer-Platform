services:
  rag:
    build: ./services/rag
    environment:
      DOCUMENTS_PATH: /app/runbooks
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  model-serving:
    build: ./services/model-serving
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MODEL_SERVICE_API_KEY: ${MODEL_SERVICE_API_KEY:-}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped

  llm-gateway:
    build: ./services/llm-gateway
    environment:
      MODEL_SERVICE_URL: http://model-serving:8000
      MODEL_SERVICE_API_KEY: ${MODEL_SERVICE_API_KEY:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      INPUT_COST_PER_1K_TOKENS_USD: ${INPUT_COST_PER_1K_TOKENS_USD:-}
      OUTPUT_COST_PER_1K_TOKENS_USD: ${OUTPUT_COST_PER_1K_TOKENS_USD:-}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-100000}
      GATEWAY_DATABASE_PATH: /data/gateway.db
    volumes:
      - gateway-data:/data
    depends_on:
      - model-serving
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped

  aiops-agent:
    build: ./services/aiops-agent
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8000
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      AIOPS_ACTION_TOKEN: ${AIOPS_ACTION_TOKEN:-}
      DATABASE_PATH: /data/incidents.db
      AUTO_REMEDIATE: ${AUTO_REMEDIATE:-false}
      ALLOWED_NAMESPACES: ${ALLOWED_NAMESPACES:-rag}
      MAX_REPLICAS: ${MAX_REPLICAS:-5}
      MAX_LLM_CALLS_PER_HOUR: ${MAX_LLM_CALLS_PER_HOUR:-20}
      MAX_ACTIONS_PER_HOUR: ${MAX_ACTIONS_PER_HOUR:-3}
    volumes:
      - incident-data:/data
    depends_on:
      - llm-gateway
    ports:
      - "127.0.0.1:8004:8000"
    restart: unless-stopped

  portal:
    build: ./services/portal
    environment:
      RAG_URL: http://rag:8000
      MODEL_URL: http://model-serving:8000
      GATEWAY_URL: http://llm-gateway:8000
      AGENT_URL: http://aiops-agent:8000
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      RAG_PUBLIC_URL: http://localhost:8001/docs
      MODEL_PUBLIC_URL: http://localhost:8002/docs
      GATEWAY_PUBLIC_URL: http://localhost:8003/docs
      AGENT_PUBLIC_URL: http://localhost:8004/docs
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
    depends_on:
      - rag
      - model-serving
      - llm-gateway
      - aiops-agent
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - rag
      - model-serving
      - llm-gateway
      - aiops-agent

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - service-auth-token
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - aiops-agent

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  incident-data:
  gateway-data:
  grafana-data:

secrets:
  service-auth-token:
    environment: SERVICE_AUTH_TOKEN
