global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: rag
    metrics_path: /metrics
    static_configs:
      - targets: ["rag:8000"]
    relabel_configs:
      - target_label: namespace
        replacement: rag
      - target_label: deployment
        replacement: rag
  - job_name: model-serving
    metrics_path: /metrics
    static_configs:
      - targets: ["model-serving:8000"]
    relabel_configs:
      - target_label: namespace
        replacement: model-serving
      - target_label: deployment
        replacement: model-serving
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["llm-gateway:8000"]
    relabel_configs:
      - target_label: namespace
        replacement: llm-gateway
      - target_label: deployment
        replacement: llm-gateway
  - job_name: aiops-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["aiops-agent:8000"]
    relabel_configs:
      - target_label: namespace
        replacement: aiops-agent
      - target_label: deployment
        replacement: aiops-agent
