name: Build aiops-agent
on:
  push:
    branches: [main]
    paths: ["services/aiops-agent/**", ".github/workflows/build-aiops-agent.yml", ".github/workflows/_build-service.yml"]
  pull_request:
    paths: ["services/aiops-agent/**", ".github/workflows/build-aiops-agent.yml", ".github/workflows/_build-service.yml"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  service:
    uses: ./.github/workflows/_build-service.yml
    with:
      service: aiops-agent
