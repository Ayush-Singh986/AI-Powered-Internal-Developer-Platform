name: Terraform plan
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-plan.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Initialize providers without remote state
        working-directory: terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=aiops-demo/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.AWS_PROJECT_NAME }}
          TF_VAR_environment: ${{ vars.AWS_ENVIRONMENT }}
          TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.CLUSTER_ADMIN_CIDRS }}
          TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
          TF_VAR_monthly_budget_limit: ${{ vars.MONTHLY_BUDGET_LIMIT || '200' }}
        run: terraform plan -input=false
