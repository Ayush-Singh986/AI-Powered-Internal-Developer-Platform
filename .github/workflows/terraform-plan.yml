name: Terraform plan
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-plan.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=aiops-demo/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.AWS_PROJECT_NAME }}
          TF_VAR_environment: ${{ vars.AWS_ENVIRONMENT }}
          TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.CLUSTER_ADMIN_CIDRS }}
        run: terraform plan -input=false
