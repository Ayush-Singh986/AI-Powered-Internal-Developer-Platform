name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/portal/web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci --prefix services/portal/web
      - run: npm run build --prefix services/portal/web
      - run: pytest -q tests

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [llm-gateway, model-serving, docs-assistant, aiops-agent, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/idp-${{ matrix.service }}:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/idp-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "0"   # report only; change to 1 to block on criticals

  bump-tags:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point every service at the new image tag (ArgoCD picks it up)
        run: |
          for s in llm-gateway model-serving docs-assistant aiops-agent portal; do
            sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" gitops/manifests/$s/kustomization.yaml
          done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "deploy: ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
