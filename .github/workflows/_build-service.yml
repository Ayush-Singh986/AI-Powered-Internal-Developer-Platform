name: Reusable service build

on:
  workflow_call:
    secrets:
      AWS_ECR_PUBLISH_ROLE_ARN:
        required: false
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  test-build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: pip install -r services/${{ inputs.service }}/requirements.txt

      - name: Run unit tests
        working-directory: services/${{ inputs.service }}
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=aiops/${{ inputs.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: services/${{ inputs.service }}
          load: true
          tags: ${{ steps.image.outputs.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push immutable image tag
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: push
        shell: bash
        run: |
          REPOSITORY="${{ vars.AWS_PROJECT_NAME }}-${{ vars.AWS_ENVIRONMENT }}/${{ inputs.service }}"
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${REPOSITORY}:${GITHUB_SHA}"
          if DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>&1)"; then
            :
          else
            ERROR="$DIGEST"
            if [[ "$ERROR" != *ImageNotFoundException* ]]; then
              echo "$ERROR" >&2
              exit 1
            fi
            docker tag "${{ steps.image.outputs.name }}" "$IMAGE"
            docker push "$IMAGE"
            DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR returned an invalid image digest: $DIGEST" >&2
            exit 1
          fi
          echo "name=${{ steps.login-ecr.outputs.registry }}/${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create digest-pinned GitOps pull request
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE="${{ steps.push.outputs.name }}"
          sed -i -E "s#^[[:space:]]*image:.*#          image: ${IMAGE}#" "k8s/base/${{ inputs.service }}/deployment.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "k8s/base/${{ inputs.service }}/deployment.yaml"
          if git diff --cached --quiet; then
            echo "Manifest already references this image; nothing to commit."
            exit 0
          fi
          branch="image-bump/${{ inputs.service }}/${GITHUB_SHA}"
          git checkout -b "$branch"
          git commit -m "chore(gitops): update ${{ inputs.service }} image to ${GITHUB_SHA}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth_header" push --force origin "$branch"
          pr_state="$(gh pr list --head "$branch" --state all --json state --jq '.[0].state // ""')"
          if [[ "$pr_state" == "CLOSED" ]]; then
            gh pr reopen "$branch"
          elif [[ "$pr_state" != "OPEN" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update ${{ inputs.service }} image to ${GITHUB_SHA}" \
              --body "Review the scanned image bump for ${{ inputs.service }} before merging."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
