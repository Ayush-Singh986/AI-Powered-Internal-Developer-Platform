name: Build portal
on:
  push:
    branches: [main]
    paths: ["services/portal/**", ".github/workflows/build-portal.yml", ".github/workflows/_build-service.yml"]
  pull_request:
    paths: ["services/portal/**", ".github/workflows/build-portal.yml", ".github/workflows/_build-service.yml"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  service:
    uses: ./.github/workflows/_build-service.yml
    with:
      service: portal
    secrets:
      AWS_ECR_PUBLISH_ROLE_ARN: ${{ secrets.AWS_ECR_PUBLISH_ROLE_ARN }}
