apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-agent-ingress
  namespace: aiops-agent
spec:
  podSelector:
    matchLabels:
      app: aiops-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portal
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rag
          podSelector:
            matchLabels:
              app: rag
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-gateway
          podSelector:
            matchLabels:
              app: llm-gateway
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
