apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-agent-ingress
  namespace: aiops-agent
spec:
  podSelector:
    matchLabels:
      app: aiops-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portal
      ports:
        - protocol: TCP
          port: 8000
