apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      serviceAccountName: aiops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiops-agent
          image: ghcr.io/OWNER/REPO/aiops-agent:sha-placeholder
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLM_GATEWAY_URL
              value: http://llm-gateway.llm-gateway.svc.cluster.local:8000
            - name: AGENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-service-auth
                  key: AGENT_SERVICE_TOKEN
            - name: LLM_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-auth
                  key: LLM_GATEWAY_API_KEY
            - name: RAG_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-auth
                  key: RAG_SERVICE_TOKEN
            - name: ALERTMANAGER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alertmanager-webhook
                  key: ALERTMANAGER_WEBHOOK_TOKEN
            - name: AIOPS_ACTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-auth
                  key: AIOPS_ACTION_TOKEN
            - name: DATABASE_PATH
              value: /data/incidents.db
            - name: ALLOWED_NAMESPACES
              value: rag
            - name: MAX_REPLICAS
              value: "5"
            - name: MAX_LLM_CALLS_PER_HOUR
              value: "20"
            - name: MAX_ACTIONS_PER_HOUR
              value: "3"
            - name: MAX_EVIDENCE_CHARS
              value: "10000"
            - name: MAX_JOB_ATTEMPTS
              value: "5"
            - name: EVIDENCE_ENABLED_NAMESPACES
              value: ""
          volumeMounts:
            - name: incident-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: incident-data
          persistentVolumeClaim:
            claimName: aiops-agent-data
