apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-safe-remediation
  namespace: llm-gateway
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-safe-remediation
  namespace: llm-gateway
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-safe-remediation
