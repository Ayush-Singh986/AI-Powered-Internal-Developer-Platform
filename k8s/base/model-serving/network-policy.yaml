apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-serving-ingress
  namespace: model-serving
spec:
  podSelector:
    matchLabels:
      app: model-serving
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
