apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: model-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-serving
          image: ghcr.io/OWNER/REPO/model-serving:sha-placeholder
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: model-serving-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: LLM_API_KEY
            - name: MODEL_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: model-serving-auth
                  key: MODEL_SERVICE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
