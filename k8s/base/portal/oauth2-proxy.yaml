apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=$(OIDC_ISSUER_URL)
            - --redirect-url=$(REDIRECT_URL)
            - --scope=openid email profile
            - --http-address=0.0.0.0:4180
            - --upstream=static://202
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --request-logging=false
            - --standard-logging=true
            - --auth-logging=true
          env:
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: oauth2-proxy-config
                  key: OIDC_ISSUER_URL
            - name: REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: oauth2-proxy-config
                  key: REDIRECT_URL
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
