apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-ingress
  namespace: portal
spec:
  podSelector:
    matchLabels:
      app: portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8501
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-agent
          podSelector:
            matchLabels:
              app: aiops-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rag
          podSelector:
            matchLabels:
              app: rag
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-gateway
          podSelector:
            matchLabels:
              app: llm-gateway
      ports:
        - protocol: TCP
          port: 8000
