apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-oauth2
  namespace: portal
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aiops.local
      secretName: aiops-local-tls
  rules:
    - host: aiops.local
      http:
        paths:
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
