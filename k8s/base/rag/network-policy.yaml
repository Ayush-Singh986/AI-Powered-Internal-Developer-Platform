apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-ingress
  namespace: rag
spec:
  podSelector:
    matchLabels:
      app: rag
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aiops-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
